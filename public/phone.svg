<!-- public/screens/screen1.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="420" height="840" role="img" aria-label="Safe 4 Talk app preview">
  <defs>
    <!-- Brand gradient -->
    <linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b7ff"/>
      <stop offset="1" stop-color="#0070f3"/>
    </linearGradient>

    <!-- Background gradient -->
    <radialGradient id="g-bg" cx="65%" cy="5%" r="90%">
      <stop offset="0" stop-color="#111a2f"/>
      <stop offset="0.45" stop-color="#0e1426"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </radialGradient>

    <!-- Soft shadow for floating items -->
    <filter id="f-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <!-- Mic pulse ring -->
    <radialGradient id="g-ring" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00b7ff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#00b7ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00b7ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Avatar symbol -->
    <symbol id="avatar" viewBox="0 0 64 64">
      <circle cx="32" cy="24" r="14" fill="url(#g-brand)"/>
      <rect x="10" y="38" width="44" height="18" rx="9" fill="#ffffff" opacity="0.12"/>
    </symbol>

    <!-- Icon: mic -->
    <symbol id="ic-mic" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 14 0h-2zM11 19h2v3h-2z"/>
    </symbol>

    <!-- Icon: phone hangup -->
    <symbol id="ic-hang" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 10c-3.87 0-7.39 1.53-10.06 4.02a1.5 1.5 0 0 0 .06 2.2l1.82 1.52a1.5 1.5 0 0 0 2.02-.09c1.28-1.3 2.9-2.26 4.69-2.75a1.5 1.5 0 0 0 1.09-1.45V11a1 1 0 0 0-1-1h-1c.34-.62 1.02-1 1.74-1h2.08c.72 0 1.4.38 1.74 1h-1a1 1 0 0 0-1 1v2.45c0 .69.45 1.29 1.09 1.45 1.79.49 3.41 1.45 4.69 2.75a1.5 1.5 0 0 0 2.02.09l1.82-1.52a1.5 1.5 0 0 0 .06-2.2C19.39 11.53 15.87 10 12 10z"/>
    </symbol>

    <!-- Icon: shield -->
    <symbol id="ic-shield" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2l7 3v6c0 5.55-3.84 10.74-7 12-3.16-1.26-7-6.45-7-12V5l7-3zm-1 13l-3-3 1.4-1.4L11 12.2l4.6-4.6L17 9l-6 6z"/>
    </symbol>

    <!-- Icon: users -->
    <symbol id="ic-users" viewBox="0 0 24 24">
      <path fill="currentColor" d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zM6 13a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm10 1c-2.21 0-6 1.11-6 3.33V20h12v-2.67C22 15.11 18.21 14 16 14zM6 15c-1.99 0-6 1-6 3v2h8v-2c0-2-4.01-3-2-3z"/>
    </symbol>

    <!-- Icon: sparkles -->
    <symbol id="ic-spark" viewBox="0 0 24 24">
      <path fill="currentColor" d="M9 2l1.8 4.2L15 8l-4.2 1.8L9 14l-1.8-4.2L3 8l4.2-1.8L9 2zm8 6l1.2 2.8L21 12l-2.8 1.2L17 16l-1.2-2.8L13 12l2.8-1.2L17 8z"/>
    </symbol>
  </defs>

  <!-- Phone body -->
  <g filter="url(#f-soft)">
    <rect x="30" y="20" width="360" height="800" rx="44" fill="#0d0f16"/>
    <rect x="38" y="28" width="344" height="784" rx="36" fill="url(#g-bg)"/>
    <!-- Notch / speaker -->
    <rect x="170" y="28" width="80" height="6" rx="3" fill="#1c2233"/>
  </g>

  <!-- App header -->
  <g transform="translate(58,72)">
    <rect width="304" height="52" rx="14" fill="rgba(255,255,255,0.04)"/>
    <circle cx="26" cy="26" r="14" fill="url(#g-brand)"/>
    <text x="50" y="31" font-family="Inter,system-ui" font-size="16" fill="#e8ebf1" opacity="0.95">Live room — EN ↔ PT</text>
    <g transform="translate(268,13)" opacity="0.85">
      <rect width="28" height="28" rx="8" fill="rgba(255,255,255,0.06)"/>
      <use href="#ic-shield" x="4" y="4" width="20" height="20" fill="#7fd8ff"/>
    </g>
  </g>

  <!-- Avatars row -->
  <g transform="translate(58,146)">
    <use href="#avatar" width="64" height="64"/>
    <use href="#avatar" x="86" width="64" height="64"/>
    <use href="#avatar" x="172" width="64" height="64"/>
    <use href="#avatar" x="258" width="64" height="64"/>
  </g>

  <!-- Wave / activity area -->
  <g transform="translate(58,236)">
    <rect width="304" height="220" rx="16" fill="rgba(255,255,255,0.03)"/>
    <!-- Simple waveform bars -->
    <g transform="translate(22,26)" fill="url(#g-brand)">
      <rect x="0"   y="30" width="6" height="40" rx="3" opacity="0.5"/>
      <rect x="14"  y="10" width="6" height="60" rx="3" opacity="0.9"/>
      <rect x="28"  y="22" width="6" height="48" rx="3" opacity="0.7"/>
      <rect x="42"  y="34" width="6" height="36" rx="3" opacity="0.6"/>
      <rect x="56"  y="20" width="6" height="50" rx="3" opacity="0.8"/>
      <rect x="70"  y="12" width="6" height="58" rx="3" opacity="0.85"/>
      <rect x="84"  y="28" width="6" height="42" rx="3" opacity="0.6"/>
      <rect x="98"  y="40" width="6" height="30" rx="3" opacity="0.45"/>
      <rect x="112" y="18" width="6" height="52" rx="3" opacity="0.75"/>
      <rect x="126" y="8"  width="6" height="62" rx="3" opacity="0.95"/>
    </g>
    <!-- Tips -->
    <text x="22" y="190" font-family="Inter,system-ui" font-size="12" fill="#a7b2c4" opacity="0.9">Tip: ask “What did you do today?”</text>
  </g>

  <!-- Bottom controls -->
  <g transform="translate(58,496)">
    <!-- Mic pulse ring -->
    <circle cx="152" cy="148" r="88" fill="url(#g-ring)"/>
    <g transform="translate(98,94)">
      <circle cx="54" cy="54" r="54" fill="url(#g-brand)"/>
      <use href="#ic-mic" x="42" y="42" width="24" height="24" fill="#fff"/>
    </g>

    <!-- Buttons -->
    <g filter="url(#f-soft)">
      <g transform="translate(0,248)">
        <rect width="304" height="56" rx="14" fill="rgba(255,255,255,0.04)"/>
        <g transform="translate(14,10)">
          <rect width="120" height="36" rx="10" fill="#1f2a44"/>
          <use href="#ic-users" x="12" y="8" width="20" height="20" fill="#9fd6ff"/>
          <text x="40" y="24" font-family="Inter,system-ui" font-size="13" fill="#d9e3f2">Invite</text>
        </g>
        <g transform="translate(170,10)">
          <rect width="120" height="36" rx="10" fill="#2a1b1d"/>
          <use href="#ic-hang" x="12" y="8" width="20" height="20" fill="#ff8a8a"/>
          <text x="40" y="24" font-family="Inter,system-ui" font-size="13" fill="#ffd7d7">Hang up</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Footer info -->
  <g transform="translate(58,784)" opacity="0.85">
    <text x="0" y="0" font-family="Inter,system-ui" font-size="12" fill="#a7b2c4">Safe 4 Talk • Voice-first practice</text>
  </g>
</svg>
